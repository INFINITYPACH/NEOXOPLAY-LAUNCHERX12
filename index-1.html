<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1b">
<meta name="description" content="NexoPlay: tu portal para descubrir y jugar videojuegos gratis directamente desde el navegador.">
<title>NexoPlay | Juegos gratis</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080d1b;--surface:#111a2d;--surface2:#172238;--text:#f4f7ff;
  --muted:#9aa8c0;--border:rgba(255,255,255,.10);--accent:#8584ff;
  --warning:#ffd166;--shadow:0 14px 38px rgba(0,0,0,.24);
}
@media(prefers-color-scheme:light){
  :root{color-scheme:light;--bg:#f2f5fb;--surface:#fff;--surface2:#edf1f8;
    --text:#172139;--muted:#69758b;--border:rgba(25,40,75,.13);
    --accent:#555be8;--warning:#966000;--shadow:0 12px 32px rgba(30,50,90,.09)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.container{width:min(1440px,100%);padding:0 26px;margin:auto}
header{text-align:center;padding:72px 0 35px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;
  border:1px solid var(--border);border-radius:999px;color:var(--muted);
  font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
h1{margin:20px 0 0;font-size:clamp(36px,6vw,66px);line-height:1.06;
  letter-spacing:-2.7px;font-weight:900;background:linear-gradient(100deg,#55d6ff,#8584ff,#d77bff);
  color:transparent;background-clip:text;-webkit-background-clip:text}
.subtitle{max-width:580px;margin:17px auto 0;color:var(--muted);font-size:15px;line-height:1.7}
.search-area{max-width:680px;margin:0 auto 35px;position:relative}
.search-area input{width:100%;padding:18px 20px 18px 54px;background:var(--surface);
  border:1px solid var(--border);border-radius:17px;outline:none;color:var(--text);
  font:inherit;font-size:15px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.search-area input::placeholder{color:var(--muted)}
.search-area input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(133,132,255,.15)}
.search-icon{position:absolute;left:19px;top:50%;transform:translateY(-50%);font-size:19px;pointer-events:none}
.results-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
  margin:0 0 18px;color:var(--muted);font-size:13px;font-weight:650}
.results-count{color:var(--text)}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:70px}
@media(min-width:700px){.games-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1100px){.games-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}}
.game-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-decoration:none;
  color:var(--text);background:var(--surface);border:1px solid var(--border);
  border-radius:17px;box-shadow:var(--shadow);transition:transform .22s ease,border-color .22s ease;
  -webkit-tap-highlight-color:transparent}
.game-card:hover{transform:translateY(-5px);border-color:var(--accent)}
.game-card:active{transform:scale(.975)}
.game-card:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.game-image{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2))}
.game-image img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;position:relative;z-index:1;background:linear-gradient(135deg,var(--c1),var(--c2))}
.game-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--c1),var(--c2));font-size:30px;color:#fff}
.game-fallback::before{content:none}
.game-number{position:absolute;top:11px;left:11px;z-index:2;min-width:31px;height:29px;
  display:grid;place-items:center;padding:0 9px;border-radius:9px;
  background:rgba(8,13,27,.82);border:1px solid rgba(255,255,255,.24);
  color:#fff;font-size:12px;font-weight:850;backdrop-filter:blur(8px)}
.game-content{padding:15px 16px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.game-name{font-size:15px;line-height:1.4;font-weight:800;overflow-wrap:anywhere}
.game-note{font-size:11px;line-height:1.5;color:var(--warning);font-weight:650}
.empty{grid-column:1/-1;text-align:center;padding:55px 20px;background:var(--surface);
  border:1px dashed var(--border);border-radius:17px;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
footer{text-align:center;padding:0 0 35px;color:var(--muted);font-size:12px}
@media(max-width:420px){
  .container{padding:0 15px}header{padding:52px 0 28px}h1{letter-spacing:-1.7px}
  .games-grid{gap:12px}.game-content{padding:12px 11px 14px}.game-name{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>

const grid = document.getElementById("games");
const search = document.getElementById("search");
const count = document.getElementById("count");

// Crea una tarjeta; si la portada falla, conserva el fondo y el emoji.
function crearTarjeta(juego) {
  const a = document.createElement("a");
  a.className = "game-card";
  a.href = juego.enlace;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", `${juego.numero}. ${juego.nombre}${juego.nota ? " " + juego.nota : ""}`);

  const cover = document.createElement("div");
  cover.className = "game-image";
  cover.style.setProperty("--c1", juego.color1);
  cover.style.setProperty("--c2", juego.color2);

  const fallback = document.createElement("div");
  fallback.className = "game-fallback";
  fallback.textContent = "";
  fallback.setAttribute("aria-hidden", "true");
  cover.appendChild(fallback);

  if (juego.imagen && juego.imagen.trim()) {
    const img = document.createElement("img");
    img.src = juego.imagen.trim();
    img.alt = `Portada de ${juego.nombre}`;
    img.loading = "lazy";
    img.onerror = () => { img.remove(); fallback.style.display = "flex"; };
    img.onload = () => { fallback.style.display = "none"; };
    cover.appendChild(img);
  }

  const number = document.createElement("span");
  number.className = "game-number";
  number.textContent = juego.numero;
  cover.appendChild(number);

  const content = document.createElement("div");
  content.className = "game-content";

  const name = document.createElement("div");
  name.className = "game-name";
  name.textContent = juego.nombre;
  content.appendChild(name);

  if (juego.nota) {
    const note = document.createElement("div");
    note.className = "game-note";
    note.textContent = juego.nota;
    content.appendChild(note);
  }

  a.append(cover, content);
  return a;
}

// Renderiza y filtra por nombre sin alterar el orden original.
function renderizar(filtro = "") {
  const termino = filtro.trim().toLocaleLowerCase("es");
  const encontrados = juegos.filter(j => j.nombre.toLocaleLowerCase("es").includes(termino));
  grid.replaceChildren();

  count.textContent = `${encontrados.length} ${encontrados.length === 1 ? "juego" : "juegos"}`;

  if (!encontrados.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    const title = document.createElement("strong");
    title.textContent = "No encontramos juegos";
    const message = document.createElement("span");
    message.textContent = "Prueba con otro nombre o revisa la búsqueda.";
    empty.append(title, message);
    grid.appendChild(empty);
    return;
  }

  encontrados.forEach(juego => grid.appendChild(crearTarjeta(juego)));
}

search.addEventListener("input", () => renderizar(search.value));
renderizar();
</script>
